<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-center mt-4 mb-4">
            <h1>Sign Up</h1>
        </div>
        <div class="d-flex justify-content-center ">
            <a href="index.html">Home</a>
        </div>
        <div>
            <h2 class="d-flex justify-content-center mt-4 ">Register your profile</h2>
            <form action="" onsubmit="return mySubmission(event)">
                <div class="from-data">
                    <label class="mt-2 f1 " for="">First Name</label>
                    <input type="text" class="" id="neededFname" placeholder="Enter FirstName" autocomplete="on">
                </div>
                <div class="from-data">
                    <label class="mt-2 f1 " for="">Last Name</label>
                    <input type="text" id="neededFname" placeholder="Enter LastName" autocomplete="on">
                </div>
                <div class="from-data">
                    <label class="mt-2 f1 " for="">Email</label>
                    <input type="text" id="neededemail" placeholder="Enter Email" autocomplete="off">
                </div>
                <div class="from-data">
                    <label class="mt-2 f1 " for="">Password</label>
                    <input type="password" id="neededpass" placeholder="password" autocomplete="on">
                </div>
                <div class="from-data ss-fdata ">
                    <button type="submit">Register</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function mySubmission(event) {
            event.preventDefault();
            let str = document.getElementById('neededFname').value;
            let emailstr = document.getElementById('neededemail').value;
            let passwordcheck = document.getElementById('neededpass').value;

            if (str == "" || emailstr == "" || passwordcheck == "") {
                alert("All fields are required.");
                return false;
            }

            // ---------------------- first Name ---------------------- 
            let regexname = /^[a-zA-Z]+(?:\s[a-zA-Z]+)*$/;
            str = str.trim();

            if (str.length === 0) {
                alert("Please enter a valid first name...");
                return false;
            }

            if (!str.match(regexname)) {
                alert("Name should contain only alphabetic characters.");
                return false;
            }

            // ------------------------- email validation -----------------------
            let at_position = emailstr.indexOf("@");
            let dot_position = emailstr.indexOf(".");
            if ((at_position < 1) || (dot_position - at_position) < 2) {
                alert("Please enter a correct email address.");
                return false;
            }

            // ------------------------- password validation -----------------------
            if (passwordcheck.length < 5) {
                alert("Password must be at least 5 characters long.");
                return false;
            }
            alert("Registered successfully...");
            window.location.href = "index.html";
            return true;
        }
    </script>
</body>
</html>
